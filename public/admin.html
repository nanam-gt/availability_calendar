<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>管理画面 | いちばん星ビレッジ 空き状況</title>
    <link rel="stylesheet" href="/css/app.css" />
    <script type="module" src="/js/admin-calendar.js"></script>
  </head>
  <body>
    <main class="page-shell admin-page">
      <header class="site-header compact">
        <p class="eyebrow">いちばん星ビレッジ</p>
        <h1>空き状況管理</h1>
      </header>

      <section class="login-panel" id="loginPanel" hidden>
        <form id="loginForm" class="login-form">
          <label for="password">共通パスワード</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required />
          <button class="primary-button" type="submit">ログイン</button>
          <p class="message" id="loginMessage" role="alert"></p>
        </form>
      </section>

      <section class="admin-workspace" id="adminWorkspace" hidden>
        <div class="admin-bar">
          <p id="lastUpdated">最終更新日時: -</p>
          <button class="secondary-button" id="logoutButton" type="button">ログアウト</button>
        </div>

        <div class="month-toolbar">
          <button class="icon-button" id="prevMonth" type="button" aria-label="前の月へ">‹</button>
          <h2 id="monthLabel" aria-live="polite"></h2>
          <button class="icon-button" id="nextMonth" type="button" aria-label="次の月へ">›</button>
        </div>

        <div class="weekday-grid" aria-hidden="true">
          <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
        </div>
        <div class="calendar-grid editable" id="calendarGrid"></div>

        <form class="status-editor" id="statusForm">
          <fieldset>
            <legend>選択日のステータス</legend>
            <label><input type="radio" name="status" value="available" checked /> ○ 空き</label>
            <label><input type="radio" name="status" value="waiting" /> △ キャンセル待ち</label>
            <label><input type="radio" name="status" value="unavailable" /> × 満室</label>
            <label><input type="radio" name="status" value="unset" /> 未設定に戻す</label>
          </fieldset>
          <button class="primary-button" type="submit">保存</button>
          <p class="selection-count" id="selectionCount">0日選択中</p>
          <p class="message" id="adminMessage" role="status"></p>
        </form>
      </section>
    </main>
  </body>
</html>
